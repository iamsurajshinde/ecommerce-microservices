server:
  port: 8085

spring:
  application:
    name: payment-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    persist-authorization: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

internal:
  service-token: ecommerce-internal-service-token

payment:
  # Active payment gateway. "mock" is the default and works out of the box.
  # Unknown/unconfigured values fall back to "mock" at runtime.
  gateway: mock

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:DUMMY_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:DUMMY_WEBHOOK_SECRET}
  currency: ${STRIPE_CURRENCY:usd}
  success-url: ${STRIPE_SUCCESS_URL:https://example.com/checkout/success}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
